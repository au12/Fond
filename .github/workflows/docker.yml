name: Build and publish

# Every push to main publishes :latest. A release is cut by changing the number
# in the VERSION file: the first push whose version has no git tag yet also
# publishes the versioned image tags and creates the GitHub release and tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      major: ${{ steps.v.outputs.major }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the web client
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the server
        run: |
          go vet ./...
          go test ./...
      - name: Decide whether this push is a release
        id: v
        run: |
          version="$(tr -d ' \n\r' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ] \
             && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.test.outputs.version }},enable=${{ needs.test.outputs.release == 'true' }}
            type=raw,value=${{ needs.test.outputs.minor }},enable=${{ needs.test.outputs.release == 'true' }}
            type=raw,value=${{ needs.test.outputs.major }},enable=${{ needs.test.outputs.release == 'true' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=v${{ needs.test.outputs.version }}${{ needs.test.outputs.release != 'true' && format('+{0}', github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, image]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Fond ${{ needs.test.outputs.version }}
          generate_release_notes: true
          body_path: docs/release-notes.md
